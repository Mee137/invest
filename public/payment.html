<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - Ignist</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background-color: #fef6e4;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 80px;
            background-color: transparent;
        }

        .logo {
            font-weight: 800;
            font-size: 2rem;
            color: #0000FF;
            text-decoration: none;
            cursor: pointer;
        }

        nav {
            display: flex;
            gap: 40px;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: #000;
            font-weight: 500;
            font-size: 1rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        nav a:hover {
            color: #0000FF;
        }

        .log-out {
            background-color: #0000FF;
            color: #fff;
            padding: 12px 28px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }

        .log-out:hover {
            background-color: #0000cc;
            transform: translateY(-2px);
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #000;
            text-decoration: none;
            margin: 40px 0 0 80px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .back-button:hover {
            transform: translateX(-5px);
        }

        .payment-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .payment-container h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 32px;
        }

        .payment-section {
            margin-bottom: 40px;
        }

        .payment-section h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 24px;
            color: #374151;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: flex;
            gap: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #374151;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background: #F3F4F6;
            border: 1px solid #E5E7EB;
            border-radius: 8px;
            font-size: 14px;
            color: #6B7280;
        }

        .form-group input:focus {
            outline: none;
            border-color: #0000FF;
        }

        .form-group input::placeholder {
            color: #9CA3AF;
        }

        .payment-methods {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }

        .payment-method {
            flex: 1;
            padding: 16px;
            border: 1px solid #E5E7EB;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: border-color 0.2s;
            min-height: 80px;
        }

        .payment-method:hover {
            border-color: #0000FF;
        }

        .payment-method.selected {
            border-color: #0000FF;
            background-color: rgba(0, 0, 255, 0.05);
        }

        .payment-method img {
            width: 100px;
            height: auto;
            object-fit: contain;
        }

        .next-button {
            width: 100%;
            padding: 14px;
            background-color: #0000FF;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 32px;
            transition: all 0.2s;
        }

        .next-button:hover {
            background-color: #0000cc;
            transform: translateY(-2px);
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 0.8rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
            font-size: 0.85rem;
        }

        @media (max-width: 768px) {
            header {
                padding: 24px 20px;
                flex-direction: column;
                gap: 1rem;
            }

            nav {
                gap: 20px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .back-button {
                margin: 20px 0 0 20px;
            }

            .payment-container {
                padding: 0 20px;
            }

            .form-row {
                flex-direction: column;
                gap: 20px;
            }
        }
    </style>
</head>

<body>
    <header>
        <a href="#" class="logo" id="homeLogo">
            <img src="images/logoo.png" alt="Ignist Logo" style="width: 120px; height: auto;">
        </a>
        <nav>
            <a href="#" class="nav-link" data-page="home">Home</a>
            <a href="#" class="nav-link" data-page="categories">Categories</a>
            <a href="#" class="nav-link" data-page="features">Features</a>
            <a href="#" class="nav-link" data-page="faqs">FAQs</a>
            <a href="#" class="nav-link" data-page="about">About Us</a>
        </nav>
        <a href="#" class="log-out" id="logoutBtn">Log out</a>
    </header>

    <a href="#" class="back-button" id="backBtn">← Back</a>

    <div class="payment-container">
        <div id="errorMessage" class="error-message"></div>
        <h1>Complete registration payment</h1>

        <div class="payment-section">
            <h2>Personal details</h2>
            <div class="form-row">
                <div class="form-group">
                    <label for="address">Address line</label>
                    <input type="text" id="address" placeholder="P.o.Box 1223">
                </div>
                <div class="form-group">
                    <label for="city">City</label>
                    <input type="text" id="city" placeholder="Arusha">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="state">State</label>
                    <input type="text" id="state" placeholder="Algiers, Algeria">
                </div>
                <div class="form-group">
                    <label for="postal">Postal code</label>
                    <input type="text" id="postal" placeholder="5050">
                </div>
            </div>
        </div>

        <div class="payment-section">
            <h2>Payment methods</h2>
            <div class="payment-methods">
                <div class="payment-method selected" data-method="bita9a">
                    <img src="images/bita9aDhahabya.png" alt="Bita9a Dhahabya" style="max-width: 100%; height: auto;">
                </div>
                <div class="payment-method" data-method="online">
                    <img src="images/paymentOnline.jpg" alt="Payment Online">
                </div>
            </div>
        </div>

        <div class="payment-section">
            <h2>Card details</h2>
            <div class="form-group">
                <label for="card-number">Card number</label>
                <input type="text" id="card-number" placeholder="Seen on your card">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="expiry">Expiry</label>
                    <input type="text" id="expiry" placeholder="MM/YY">
                </div>
                <div class="form-group">
                    <label for="cvc">CVC</label>
                    <input type="text" id="cvc" placeholder="654">
                </div>
            </div>
        </div>

        <button type="button" class="next-button" id="nextBtn">Next</button>
    </div>

    <script>
        // Show error message
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 3000);
        }

        // Payment method selection
        document.querySelectorAll('.payment-method').forEach(method => {
            method.addEventListener('click', () => {
                document.querySelectorAll('.payment-method').forEach(m => {
                    m.classList.remove('selected');
                });
                method.classList.add('selected');
            });
        });

        // Navigation Functionality
        function navigateTo(page) {
            if (page === 'home') {
                window.location.href = 'index.html';
            } else if (page === 'categories') {
                window.location.href = 'index.html';
            } else if (page === 'features') {
                window.location.href = 'index.html';
            } else if (page === 'faqs') {
                window.location.href = 'index.html';
            } else if (page === 'about') {
                window.location.href = 'index.html';
            }
        }

        // Handle navigation clicks
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const page = this.getAttribute('data-page');
                navigateTo(page);
            });
        });

        // Home logo click
        document.getElementById('homeLogo').addEventListener('click', function(e) {
            e.preventDefault();
            window.location.href = 'index.html';
        });

        // Back button
        document.getElementById('backBtn').addEventListener('click', function(e) {
            e.preventDefault();
            window.history.back();
        });

        // Log out button
        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('current_user');
            window.location.href = 'index.html';
        });

        // Next button - validate and proceed
        document.getElementById('nextBtn').addEventListener('click', function() {
            // Get form values
            const address = document.getElementById('address').value.trim();
            const city = document.getElementById('city').value.trim();
            const state = document.getElementById('state').value.trim();
            const postal = document.getElementById('postal').value.trim();
            const cardNumber = document.getElementById('card-number').value.trim();
            const expiry = document.getElementById('expiry').value.trim();
            const cvc = document.getElementById('cvc').value.trim();
            
            // Validate personal details
            if (!address) {
                showError('Please enter your address');
                return;
            }
            if (!city) {
                showError('Please enter your city');
                return;
            }
            if (!state) {
                showError('Please enter your state');
                return;
            }
            if (!postal) {
                showError('Please enter your postal code');
                return;
            }
            
            // Validate card details
            if (!cardNumber) {
                showError('Please enter your card number');
                return;
            }
            if (cardNumber.length < 15) {
                showError('Please enter a valid card number');
                return;
            }
            if (!expiry) {
                showError('Please enter expiry date');
                return;
            }
            if (!cvc) {
                showError('Please enter CVC code');
                return;
            }
            if (cvc.length < 3) {
                showError('Please enter a valid CVC code');
                return;
            }
            
            // Get selected payment method
            const selectedMethod = document.querySelector('.payment-method.selected');
            let paymentMethod = 'bita9a';
            if (selectedMethod && selectedMethod.getAttribute('data-method') === 'online') {
                paymentMethod = 'online';
            }
            
            // Save payment data to localStorage
            const paymentData = {
                address: address,
                city: city,
                state: state,
                postal: postal,
                cardNumber: '****' + cardNumber.slice(-4),
                expiry: expiry,
                paymentMethod: paymentMethod,
                timestamp: new Date().toISOString()
            };
            localStorage.setItem('temp_payment_data', JSON.stringify(paymentData));
            
            // Navigate to payment2.html with data
            const params = new URLSearchParams();
            params.append('address', address);
            params.append('city', city);
            params.append('state', state);
            params.append('postal', postal);
            params.append('card-number', cardNumber);
            params.append('expiry', expiry);
            params.append('cvc', cvc);
            params.append('payment-method', paymentMethod);
            
            window.location.href = 'payment2.html?' + params.toString();
        });

        // Enter key support
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    document.getElementById('nextBtn').click();
                }
            });
        });
    </script>
</body>

</html>
